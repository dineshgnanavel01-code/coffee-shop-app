<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Roast & Ritual — Coffee Shop</title>
    <link rel="icon" type="image/png" href="/manus-storage/logo-mark_30cba49d.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Only load analytics when the Manus environment variables are injected;
      // local `pnpm dev` and external hosting (Netlify/Vercel) skip this.
      if ("%VITE_ANALYTICS_ENDPOINT%".startsWith("http")) {
        var s = document.createElement("script");
        s.defer = true;
        s.src = "%VITE_ANALYTICS_ENDPOINT%/umami";
        s.setAttribute("data-website-id", "%VITE_ANALYTICS_WEBSITE_ID%");
        document.body.appendChild(s);
      }
    </script>
  </body>

</html>
